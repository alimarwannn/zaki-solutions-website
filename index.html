  <script>
    // Theme before first paint: saved choice, else the device setting.
    (function(){try{var t=localStorage.getItem("zs-theme");if(t?t==="light":matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.classList.add("light")}catch(e){}})();
  </script>
  <style>
    /* Zaki brand tokens (same values as the app's static/css/dashboard.css) */
    :root{color-scheme:dark;--bg:#12100d;--surface:#1f1a13;--t:#f7f6f2;--t2:#cbc5b8;--t3:#9d9485;--line:rgba(247,246,242,.11);--line-2:rgba(247,246,242,.18);--ink:#111716;--ivory:#f7f6f2;--brass:#b88a3b;--brass-2:#d1a24b;--silver:#e2e4df;--tape:#f4c430;--shadow:0 1px 0 rgba(255,255,255,.045) inset,0 20px 55px rgba(0,0,0,.3);--ease:cubic-bezier(.22,1,.36,1);--cycle:14s}
    :root.light{color-scheme:light;--bg:#eeede7;--surface:#fff;--t:#111716;--t2:#3e4743;--t3:#6f7773;--line:rgba(17,23,22,.10);--line-2:rgba(17,23,22,.17);--shadow:0 1px 0 rgba(255,255,255,.9) inset,0 22px 60px rgba(17,23,22,.12)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;overflow:clip}
    body{height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--t);font-family:"Plus Jakarta Sans","Cairo",sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
    body.ar{font-family:"Cairo","Plus Jakarta Sans",sans-serif}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid #d8ad5b;outline-offset:3px;border-radius:12px}

    /* backdrop: brass glow + fine brass lines, like the app login */
    body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(720px 520px at 50% 30%,rgba(184,138,59,.2),transparent 70%),radial-gradient(620px 420px at 85% 85%,rgba(247,246,242,.05),transparent 68%),linear-gradient(135deg,#0a0f0e,#111716 58%,#151310)}
    :root.light body::before{background:radial-gradient(760px 520px at 50% 30%,rgba(184,138,59,.18),transparent 68%),linear-gradient(135deg,#f7f6f2,#eeede7 60%,#e8e2d6)}
    body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background:repeating-linear-gradient(90deg,transparent 0 82px,rgba(184,138,59,.08) 83px,transparent 84px)}

    /* language + theme toggles: the only controls besides contact */
    .toggles{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:flex;gap:8px;z-index:20;direction:ltr}
    .tog{height:40px;min-width:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(247,246,242,.07);color:var(--t);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font:700 12.5px "Plus Jakarta Sans","Cairo",sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:border-color .2s,transform .2s var(--ease)}
    :root.light .tog{background:rgba(255,255,255,.75)}
    .tog:hover{border-color:var(--brass);transform:translateY(-1px)}
    .tog svg{width:17px;height:17px}
    .tog .moon{display:none}:root.light .tog .sun{display:none}:root.light .tog .moon{display:block}

    main{flex:1;min-height:0;width:100%;overflow:hidden;overflow:clip;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 18px 8px;gap:clamp(14px,2.6vh,26px)}

    /* ── scene: sign on posts, tape, robot ─────────────────────────── */
    .scene{--bw:min(86vw,540px);--bh:clamp(96px,19vh,175px);--ph:clamp(60px,12vh,112px);--rb:clamp(70px,14vh,124px);position:relative;width:var(--bw);height:calc(var(--bh) + var(--ph));flex:0 0 auto;direction:ltr}
    .ground{position:absolute;left:-40%;right:-40%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--brass) 25%,var(--brass) 75%,transparent);opacity:.55}

    .sign{position:absolute;inset:0 0 auto 0;height:var(--bh);z-index:1;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.1deg)}}
    .board{position:absolute;inset:0;border-radius:18px;background:var(--surface);border:3px solid var(--brass);box-shadow:var(--shadow);overflow:hidden;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.4vw,18px);padding:16px 22px}
    .board::before,.board::after{content:"";position:absolute;left:0;right:0;height:9px;background:repeating-linear-gradient(-45deg,var(--tape) 0 10px,var(--ink) 10px 20px)}
    .board::before{top:0}.board::after{bottom:0}
    .board img{height:62%;width:auto;flex:0 0 auto}
    .board .on-light{display:none}:root.light .board .on-light{display:block}:root.light .board .on-dark{display:none}
    .wordmark{text-align:left;line-height:1}
    .wordmark b{display:block;font-weight:800;font-size:clamp(26px,5.4vh,44px);letter-spacing:-.04em;color:var(--t)}
    .wordmark span{display:block;margin-top:6px;font-weight:800;font-size:clamp(10px,1.7vh,13px);letter-spacing:.36em;text-transform:uppercase;color:var(--brass-2)}
    :root.light .wordmark span{color:var(--brass)}
    .bolt{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--brass-2);box-shadow:inset -1px -1px 0 rgba(0,0,0,.35);z-index:2}
    .bolt.tl{top:15px;left:12px}.bolt.tr{top:15px;right:12px}.bolt.bl{bottom:15px;left:12px}.bolt.br{bottom:15px;right:12px}
    .bolt.loose{animation:loose 2.2s ease-in-out infinite}
    @keyframes loose{0%,100%{transform:rotate(0)}50%{transform:rotate(160deg)}}

    .post{position:absolute;top:calc(var(--bh) - 4px);bottom:0;width:12px;margin-left:-6px;border-radius:4px 4px 0 0;background:repeating-linear-gradient(180deg,var(--tape) 0 12px,var(--ink) 12px 24px);border:1.5px solid var(--brass);z-index:0}
    .post.l{left:12%}.post.r{left:88%}
    .post::after{content:"";position:absolute;left:-7px;right:-7px;bottom:-1px;height:6px;border-radius:3px;background:var(--brass)}

    /* caution tape: crosses the whole screen, in front of the sign, behind the robot */
    .tape{position:absolute;left:50%;top:calc(var(--bh) + var(--ph) * .42);width:max(2400px,300vw);height:clamp(36px,5.6vh,48px);transform:translate(-50%,-50%) rotate(-8deg);z-index:2;background:var(--tape);color:var(--ink);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);display:flex;align-items:center;pointer-events:none}
    :root.light .tape{box-shadow:0 10px 26px rgba(17,23,22,.18)}
    .tape-run{display:flex;white-space:nowrap;animation:run 60s linear infinite;font:900 clamp(13px,2.1vh,17px)/1 "Plus Jakarta Sans","Cairo",sans-serif;letter-spacing:.14em;text-transform:uppercase}
    .tape-run span{padding-right:1.4em}
    @keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}

    /* robot */
    .bot{position:absolute;bottom:0;width:var(--rb);height:calc(var(--rb) * 1.2);z-index:3;left:calc(12% + 8px);animation:move var(--cycle) ease-in-out infinite}
    .bot-shadow{position:absolute;left:12%;right:12%;bottom:-5px;height:8px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(3px)}
    :root.light .bot-shadow{background:rgba(17,23,22,.18)}
    .facing{position:absolute;inset:0;animation:face var(--cycle) linear infinite}
    .bot svg{width:100%;height:100%;overflow:visible;display:block;animation:bob .45s ease-in-out infinite alternate}
    @keyframes bob{to{transform:translateY(-2px)}}
    @keyframes move{0%,16%{left:calc(12% + 8px)}44%,62%{left:calc(88% - var(--rb) - 8px)}90%,100%{left:calc(12% + 8px)}}
    @keyframes face{0%,14.9%{transform:scaleX(-1)}15%,60.9%{transform:scaleX(1)}61%,100%{transform:scaleX(-1)}}
    /* the working arm, wrench and sparks only show while Zaki is at a post */
    .work{animation:gateOn var(--cycle) linear infinite}
    .rest{animation:gateOff var(--cycle) linear infinite}
    @keyframes gateOn{0%,13.9%{opacity:1}14%,43.9%{opacity:0}44%,59.9%{opacity:1}60%,89.9%{opacity:0}90%,100%{opacity:1}}
    @keyframes gateOff{0%,13.9%{opacity:0}14%,43.9%{opacity:1}44%,59.9%{opacity:0}60%,89.9%{opacity:1}90%,100%{opacity:0}}
    .swing{transform-box:view-box;transform-origin:72px 80px;animation:swing .3s ease-in-out infinite alternate}
    @keyframes swing{from{transform:rotate(-16deg)}to{transform:rotate(18deg)}}
    .wrench{stroke:var(--silver)}:root.light .wrench{stroke:#3e4743}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    .antenna{transform-box:view-box;transform-origin:50px 24px;animation:wiggle 1.2s ease-in-out infinite alternate}
    @keyframes wiggle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
    .beacon{animation:beacon 1s ease-in-out infinite alternate}
    @keyframes beacon{from{opacity:.55}to{opacity:1}}
    .tread{stroke-dasharray:4 4;animation:tread .5s linear infinite}
    @keyframes tread{to{stroke-dashoffset:-8}}
    .core{animation:beacon 1.6s ease-in-out infinite alternate}
    .sparks{position:absolute;right:-6%;bottom:2%;width:0;height:0}
    .sparks i{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd76a;box-shadow:0 0 8px #ffb52e;opacity:0;animation:spark .55s ease-out infinite}
    .sparks i:nth-child(1){--dx:14px;--dy:-16px}
    .sparks i:nth-child(2){--dx:20px;--dy:-4px;animation-delay:.12s}
    .sparks i:nth-child(3){--dx:8px;--dy:-22px;animation-delay:.24s}
    .sparks i:nth-child(4){--dx:18px;--dy:-12px;animation-delay:.36s}
    .sparks i:nth-child(5){--dx:4px;--dy:-10px;animation-delay:.45s}
    @keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}

    /* ── copy + contact ────────────────────────────────────────────── */
    .copy{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:4}
    h1{font-weight:800;font-size:clamp(28px,5vw,52px);line-height:1.05;letter-spacing:-.04em;max-width:17ch}
    h1 em{font-style:normal;color:var(--brass-2)}
    :root.light h1 em{color:var(--brass)}
    body.ar h1{letter-spacing:0;line-height:1.3}
    .lead{color:var(--t2);font-size:clamp(14.5px,1.6vw,17px);line-height:1.6;max-width:460px}
    .contact{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative;z-index:4}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:700;font-size:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--t);box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
    .btn:hover{transform:translateY(-2px);border-color:var(--brass)}
    .btn svg{width:18px;height:18px;flex:0 0 auto}
    .btn.primary{background:linear-gradient(135deg,var(--brass-2),var(--brass));border-color:transparent;color:#12100d;box-shadow:0 14px 34px rgba(184,138,59,.32)}
    .btn.primary:hover{box-shadow:0 18px 40px rgba(184,138,59,.42)}
    footer{flex:0 0 auto;text-align:center;padding:4px 16px max(12px,env(safe-area-inset-bottom));font-size:11.5px;color:var(--t3);position:relative;z-index:4}

    .reveal{animation:up .8s var(--ease) both}
    .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

    /* phone */
    @media (max-width:560px){
      main{padding:62px 16px 6px}
      .tog{height:38px;padding:0 12px}
      .tape{transform:translate(-50%,-50%) rotate(-13deg)}
      .board{padding:14px 16px;border-radius:16px}
      h1{font-size:clamp(26px,8vw,36px)}
      .contact{width:100%;max-width:340px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
      .contact .primary{grid-column:1/-1}
      .btn{height:44px;padding:0 12px;font-size:13.5px}
    }
    /* short screens: shrink everything so it still fits without scrolling */
    @media (max-height:660px){
      main{padding-top:56px;gap:12px}
      .scene{--bh:clamp(80px,16vh,120px);--ph:clamp(44px,9vh,70px);--rb:clamp(52px,10vh,76px)}
      .lead{font-size:14px;line-height:1.45}
      h1{font-size:clamp(22px,5.2vh,40px)}
      .btn{height:40px}
    }
    @media (max-height:500px){.lead{display:none}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>

      lang = next;
      const ar = lang === "ar";
      document.documentElement.lang = lang;
      document.documentElement.dir = ar ? "rtl" : "ltr";
      document.body.classList.toggle("ar", ar);
      document.querySelectorAll("[data-en]").forEach(el => { el.innerHTML = el.dataset[lang]; });
      document.getElementById("langBtn").textContent = ar ? "English" : "العربية";
      try { localStorage.setItem("zs-lang", lang); } catch (e) {}
    }
    document.getElementById("langBtn").onclick = () => setLang(lang === "en" ? "ar" : "en");

    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const syncThemeMeta = () => { themeMeta.content = document.documentElement.classList.contains("light") ? "#eeede7" : "#12100d"; };
    document.getElementById("themeBtn").onclick = () => {
      const light = document.documentElement.classList.toggle("light");
      syncThemeMeta();
      try { localStorage.setItem("zs-theme", light ? "light" : "dark"); } catch (e) {}
    };
    syncThemeMeta();

    let saved = null; try { saved = localStorage.getItem("zs-lang"); } catch (e) {}
    setLang(saved || ((navigator.language || "").startsWith("ar") ? "ar" : "en"));
  </script>
</body>
</html>
